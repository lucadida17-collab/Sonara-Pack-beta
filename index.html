<!DOCTYPE html>
<html lang="fr" translate="yes">
<head>
  <meta charset="UTF-8">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-NEBG1Z3EE0"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-NEBG1Z3EE0');
  </script>

  <link rel="stylesheet" href="app/css/index.css?v=pre-v1-sonara-loader">
  <link rel="icon" href="assets/image/logo-sonara-pack.PNG" type="image/png">
  <link rel="shortcut icon" href="assets/image/logo-sonara-pack.PNG" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sonara Pack</title>
  <link rel="stylesheet" href="app/css/i18n.css">
</head>

<body class="Load">
  <main
    class="sonara-entry-loader"
    id="sonaraEntryLoader"
    role="progressbar"
    aria-label="Chargement de Sonara Pack"
    aria-valuemin="0"
    aria-valuemax="100"
    aria-valuenow="0"
  >
    <div class="sonara-loader-glow sonara-loader-glow-one" aria-hidden="true"></div>
    <div class="sonara-loader-glow sonara-loader-glow-two" aria-hidden="true"></div>

    <section class="sonara-loader-content">
      <div class="sonara-loader-scene" aria-hidden="true">
        <span class="sonara-loader-orbit sonara-loader-orbit-one"></span>
        <span class="sonara-loader-orbit sonara-loader-orbit-two"></span>
        <div class="sonara-loader-logo">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>

      <p class="sonara-loader-kicker">SONARA PACK</p>
      <h1>Connexion à votre espace</h1>

      <p
        class="intro-chargement sonara-loader-message"
        id="sonaraLoadingStatus"
        aria-live="polite"
        aria-atomic="true"
      >Initialisation de Sonara Pack…</p>

      <div class="sonara-loader-progress" aria-hidden="true">
        <span class="sonara-loader-progress-fill" id="sonaraProgressFill"></span>
      </div>

      <div class="sonara-loader-meta" aria-hidden="true">
        <span id="sonaraLoadingStep">Initialisation</span>
        <span id="sonaraLoadingPercent">0%</span>
      </div>

      <button class="sonara-loader-retry" id="sonaraRetryButton" type="button" hidden>
        Réessayer
      </button>
    </section>
  </main>

  <script src="app/js/i18n.js?v=pre-v1-global-official"></script>
  <script src="config.js"></script>
  <script>
    (() => {
      "use strict";

      // Contrat stable Sonara Pack :
      // - 6 secondes visibles minimum, même si Local/Test/Main répond immédiatement ;
      // - 14 secondes maximum pour obtenir une réponse serveur ;
      // - après l'erreur, l'écran reste affiché jusqu'au clic manuel sur « Réessayer ».
      const MIN_LOADING_DURATION = 6000;
      const SERVER_MAX_WAIT = 14000;
      const SERVER_ATTEMPT_TIMEOUT = 3500;
      const SERVER_RETRY_DELAY = 650;
      const MIN_STEP_TIME = 360;
      const TYPE_SPEED = 18;

      const loader = document.getElementById("sonaraEntryLoader");
      const statusElement = document.getElementById("sonaraLoadingStatus");
      const progressFill = document.getElementById("sonaraProgressFill");
      const progressPercent = document.getElementById("sonaraLoadingPercent");
      const progressStep = document.getElementById("sonaraLoadingStep");
      const retryButton = document.getElementById("sonaraRetryButton");

      let typingRun = 0;
      let currentProgress = 0;
      let currentStatusSource = "Initialisation de Sonara Pack…";
      let currentStepSource = "Initialisation";
      let loadingStartedAt = 0;

      function wait(ms) {
        return new Promise((resolve) => window.setTimeout(resolve, ms));
      }

      async function waitForTranslations() {
        try {
          await window.SonaraI18n?.ready;
        } catch (error) {
          console.warn("Traduction du chargement indisponible :", error);
        }
      }

      function t(value) {
        return window.SonaraI18n?.t?.(value) || String(value || "");
      }

      function setProgress(value, stepLabel) {
        const safeValue = Math.min(100, Math.max(currentProgress, Number(value) || 0));
        currentProgress = safeValue;
        if (stepLabel) currentStepSource = stepLabel;

        if (progressFill) progressFill.style.width = `${safeValue}%`;
        if (progressPercent) progressPercent.textContent = `${Math.round(safeValue)}%`;
        if (progressStep && currentStepSource) progressStep.textContent = t(currentStepSource);
        loader?.setAttribute("aria-valuenow", String(Math.round(safeValue)));
      }

      async function writeStatus(message, instant = false) {
        if (!statusElement) return;

        currentStatusSource = String(message || "");
        const runId = ++typingRun;
        const text = t(currentStatusSource);
        statusElement.classList.add("is-writing");
        statusElement.textContent = "";

        if (instant) {
          statusElement.textContent = text;
          statusElement.classList.remove("is-writing");
          return;
        }

        for (let index = 0; index < text.length; index += 1) {
          if (runId !== typingRun) return;
          statusElement.textContent += text[index];
          await wait(TYPE_SPEED);
        }

        if (runId === typingRun) statusElement.classList.remove("is-writing");
      }

      async function showStep(message, progress, stepLabel, minimumTime = MIN_STEP_TIME) {
        setProgress(progress, stepLabel);
        await Promise.all([writeStatus(message), wait(minimumTime)]);
      }

      async function fetchWithTimeout(url, options = {}, timeoutMs = SERVER_ATTEMPT_TIMEOUT) {
        const controller = new AbortController();
        const timeout = window.setTimeout(() => controller.abort(), timeoutMs);

        try {
          return await fetch(url, {
            ...options,
            cache: "no-store",
            headers: { Accept: "application/json", ...(options.headers || {}) },
            signal: controller.signal
          });
        } finally {
          window.clearTimeout(timeout);
        }
      }

      async function checkServerUntilReady() {
        const serverSearchStartedAt = performance.now();
        const deadline = serverSearchStartedAt + SERVER_MAX_WAIT;
        let attempt = 0;
        let lastError = new Error("Le serveur Sonara ne répond pas.");

        while (performance.now() < deadline) {
          attempt += 1;
          const elapsed = performance.now() - serverSearchStartedAt;
          const remaining = Math.max(0, deadline - performance.now());
          const progress = 12 + Math.min(22, (elapsed / SERVER_MAX_WAIT) * 22);
          setProgress(progress, `Serveur · tentative ${attempt}`);

          try {
            const attemptTimeout = Math.max(500, Math.min(SERVER_ATTEMPT_TIMEOUT, remaining));
            const response = await fetchWithTimeout(
              `${API_URL}/api/health`,
              { method: "GET" },
              attemptTimeout
            );
            const payload = await response.json().catch(() => null);

            if (response.ok && payload?.ok === true) return payload;
            lastError = new Error(`Réponse serveur invalide : ${response.status}`);
          } catch (error) {
            lastError = error;
          }

          const waitRemaining = deadline - performance.now();
          if (waitRemaining <= 0) break;
          await wait(Math.min(SERVER_RETRY_DELAY, waitRemaining));
        }

        throw lastError;
      }

      async function waitForMinimumLoadingDuration() {
        const remaining = MIN_LOADING_DURATION - (performance.now() - loadingStartedAt);
        if (remaining > 0) await wait(remaining);
      }

      function clearSession() {
        window.SonaraAuth?.clear?.();
      }

      function goToInscription() {
        window.location.replace("/app/pages/inscription.html");
      }

      function redirectByRole(profile) {
        const role = String(profile?.role || "").toLowerCase();
        const status = String(profile?.status || "").toLowerCase();

        if (["artist", "both"].includes(role)) {
          window.location.replace(
            status === "pending"
              ? "/app/pages/pending.html"
              : "/app/pages/creator.html"
          );
          return;
        }

        if (role === "user") {
          window.location.replace("/home.html");
          return;
        }

        clearSession();
        goToInscription();
      }

      function loadAuthGuard() {
        return new Promise((resolve, reject) => {
          if (window.SonaraAuth?.ready) {
            resolve();
            return;
          }

          const existing = document.querySelector('script[data-sonara-auth="entry"]');
          if (existing) {
            existing.addEventListener("load", resolve, { once: true });
            existing.addEventListener("error", reject, { once: true });
            return;
          }

          const script = document.createElement("script");
          script.src = "/app/js/auth-guard.js?v=pre-v1-stable";
          script.dataset.sonaraAuth = "entry";
          script.onload = resolve;
          script.onerror = () => reject(new Error("Auth Guard indisponible."));
          document.body.appendChild(script);
        });
      }

      async function showServerError() {
        loader?.classList.add("has-error");
        setProgress(Math.max(currentProgress, 12), "Serveur indisponible");
        await writeStatus("Connexion au serveur impossible.", true);
        if (retryButton) retryButton.hidden = false;
        // Aucun autre minuteur : l'utilisateur peut laisser cet écran ouvert
        // aussi longtemps qu'il le souhaite, puis choisir lui-même « Réessayer ».
      }

      async function startSonara() {
        loadingStartedAt = performance.now();
        loader?.classList.remove("has-error");
        if (retryButton) retryButton.hidden = true;

        try {
          await waitForTranslations();
          await showStep("Recherche du serveur Sonara Pack…", 12, "Serveur · 1/4");
          await checkServerUntilReady();

          await Promise.all([
            loadAuthGuard(),
            showStep("Serveur trouvé. Chargement des données…", 42, "Données · 2/4")
          ]);

          const [, authResult] = await Promise.all([
            showStep("Recherche de l’ID du compte connecté…", 68, "Compte · 3/4"),
            window.SonaraAuth.ready
          ]);

          if (!authResult?.ok) {
            if (authResult?.reason === "server_unavailable") {
              await showServerError();
              return;
            }

            if ([
              "missing_profile",
              "profile_not_found",
              "invalid_profile",
              "blocked",
              "permanently_deleted"
            ].includes(authResult?.reason)) {
              const message = authResult.reason === "missing_profile"
                ? "Aucun ID connecté. Ouverture de l’inscription…"
                : "ID introuvable. Retour à l’inscription…";

              await showStep(message, 92, "Inscription · 4/4", 520);
              await waitForMinimumLoadingDuration();
              setProgress(100, "Inscription");
              await wait(180);
              goToInscription();
              return;
            }

            await showServerError();
            return;
          }

          await showStep("ID retrouvé. Préparation de votre dashboard…", 88, "Accès · 4/4", 460);
          await waitForMinimumLoadingDuration();
          await showStep("Entrée dans Sonara Pack…", 100, "Sonara Pack", 420);
          redirectByRole(authResult.profile);
        } catch (error) {
          console.error("Chargement Sonara impossible :", error);
          await showServerError();
        }
      }

      retryButton?.addEventListener("click", () => window.location.reload());
      window.addEventListener("sonara:languagechange", () => {
        writeStatus(currentStatusSource, true);
        setProgress(currentProgress, currentStepSource);
      });

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", startSonara, { once: true });
      } else {
        startSonara();
      }
    })();
  </script>
</body>
</html>

  <script src="/app/js/system/loading-experience.js?v=loading-bg-v1"></script>
  <script>
    (() => {
      "use strict";

      // Contrat stable Sonara Pack :
      // - 6 secondes visibles minimum, même si Local/Test/Main répond immédiatement ;
      // - 15 secondes maximum avant de déclarer le serveur indisponible ;
      // - tant que ces 15 secondes ne sont pas écoulées, un échec réseau temporaire
      //   (health ou vérification du compte) ne déclenche pas l'écran d'erreur ;
      // - le routeur MAIN privilégie Render puis bascule sur Northflank si Render est indisponible ;
      // - après l'erreur, l'écran reste affiché jusqu'au clic manuel sur « Réessayer ».
      const MIN_LOADING_DURATION = 6000;
      const MAX_LOADING_DURATION = 15000;
      const SERVER_ATTEMPT_TIMEOUT = 8000;
      const SERVER_RETRY_BASE_DELAY = 1200;
      const SERVER_RETRY_MAX_DELAY = 2500;
      const SERVER_RATE_LIMIT_DELAY = 2500;
      const MIN_STEP_TIME = 360;
      const TYPE_SPEED = 18;

      const loader = document.getElementById("sonaraEntryLoader");
      const statusElement = document.getElementById("sonaraLoadingStatus");
      const progressFill = document.getElementById("sonaraProgressFill");
      const progressPercent = document.getElementById("sonaraLoadingPercent");
      const progressStep = document.getElementById("sonaraLoadingStep");
      const retryButton = document.getElementById("sonaraRetryButton");
      const languageChoice = document.getElementById("sonaraLanguageChoice");
      const languageChoiceButtons = Array.from(
        document.querySelectorAll("#sonaraLanguageChoiceGrid [data-language]")
      );

      let typingRun = 0;
      let currentProgress = 0;
      let currentStatusSource = "Initialisation de Sonara Pack…";
      let currentStepSource = "Initialisation";
      let loadingStartedAt = 0;

      function wait(ms) {
        return new Promise((resolve) => window.setTimeout(resolve, ms));
      }

      async function waitForTranslations() {
        try {
          await window.SonaraI18n?.ready;
        } catch (error) {
          console.warn("Traduction du chargement indisponible :", error);
        }
      }

      function t(value) {
        return window.SonaraI18n?.t?.(value) || String(value || "");
      }

      function setProgress(value, stepLabel) {
        const safeValue = Math.min(100, Math.max(currentProgress, Number(value) || 0));
        currentProgress = safeValue;
        if (stepLabel) currentStepSource = stepLabel;

        if (progressFill) progressFill.style.width = `${safeValue}%`;
        if (progressPercent) progressPercent.textContent = `${Math.round(safeValue)}%`;
        if (progressStep && currentStepSource) progressStep.textContent = t(currentStepSource);
        loader?.setAttribute("aria-valuenow", String(Math.round(safeValue)));
      }

      async function writeStatus(message, instant = false) {
        if (!statusElement) return;

        currentStatusSource = String(message || "");
        const runId = ++typingRun;
        const text = t(currentStatusSource);
        statusElement.classList.add("is-writing");
        statusElement.textContent = "";

        if (instant) {
          statusElement.textContent = text;
          statusElement.classList.remove("is-writing");
          return;
        }

        for (let index = 0; index < text.length; index += 1) {
          if (runId !== typingRun) return;
          statusElement.textContent += text[index];
          await wait(TYPE_SPEED);
        }

        if (runId === typingRun) statusElement.classList.remove("is-writing");
      }

      async function showStep(message, progress, stepLabel, minimumTime = MIN_STEP_TIME) {
        setProgress(progress, stepLabel);
        await Promise.all([writeStatus(message), wait(minimumTime)]);
      }

      async function fetchWithTimeout(url, options = {}, timeoutMs = SERVER_ATTEMPT_TIMEOUT) {
        const controller = new AbortController();
        const timeout = window.setTimeout(() => controller.abort(), timeoutMs);

        try {
          return await fetch(url, {
            ...options,
            cache: "no-store",
            headers: { Accept: "application/json", ...(options.headers || {}) },
            signal: controller.signal
          });
        } finally {
          window.clearTimeout(timeout);
        }
      }

      function retryAfterMilliseconds(response) {
        const value = response?.headers?.get?.("Retry-After");
        if (!value) return 0;

        const seconds = Number(value);
        if (Number.isFinite(seconds) && seconds >= 0) {
          return seconds * 1000;
        }

        const date = Date.parse(value);
        return Number.isFinite(date) ? Math.max(0, date - Date.now()) : 0;
      }

      function normalRetryDelay(attempt) {
        return Math.min(
          SERVER_RETRY_MAX_DELAY,
          SERVER_RETRY_BASE_DELAY + Math.max(0, attempt - 1) * 2500
        );
      }

      function loadingDeadline() {
        return loadingStartedAt + MAX_LOADING_DURATION;
      }

      function loadingTimeRemaining() {
        return Math.max(0, loadingDeadline() - performance.now());
      }

      async function checkServerUntilReady() {
        const serverSearchStartedAt = performance.now();
        const deadline = loadingDeadline();
        let attempt = 0;
        let lastError = new Error("Le serveur Sonara ne répond pas.");

        while (performance.now() < deadline) {
          attempt += 1;
          const elapsed = performance.now() - serverSearchStartedAt;
          const remaining = Math.max(0, deadline - performance.now());
          const progress = 12 + Math.min(22, (elapsed / MAX_LOADING_DURATION) * 22);
          setProgress(progress, `Serveur · tentative ${attempt}`);

          let retryDelay = normalRetryDelay(attempt);

          try {
            const attemptTimeout = Math.max(500, Math.min(SERVER_ATTEMPT_TIMEOUT, remaining));
            const response = await fetchWithTimeout(
              `${API_URL}/api/health`,
              { method: "GET" },
              attemptTimeout
            );
            const payload = await response.json().catch(() => null);

            if (response.ok && payload?.ok === true) return payload;

            if (response.status === 429) {
              retryDelay = Math.max(
                SERVER_RATE_LIMIT_DELAY,
                retryAfterMilliseconds(response)
              );
              lastError = new Error("Serveur temporairement limité (429).");
            } else {
              lastError = new Error(`Réponse serveur invalide : ${response.status}`);
            }
          } catch (error) {
            // Un 429 renvoyé par l'hébergeur peut être masqué par CORS et arriver ici
            // comme une simple erreur réseau. On espace donc aussi ces échecs.
            lastError = error;
            retryDelay = Math.max(retryDelay, SERVER_RETRY_BASE_DELAY);
          }

          const waitRemaining = deadline - performance.now();
          if (waitRemaining <= 0) break;
          await wait(Math.min(retryDelay, waitRemaining));
        }

        throw lastError;
      }

      async function waitForMinimumLoadingDuration() {
        const remaining = MIN_LOADING_DURATION - (performance.now() - loadingStartedAt);
        if (remaining > 0) await wait(remaining);
      }

      async function waitForAuthResult(promise) {
        const remaining = loadingTimeRemaining();
        if (remaining <= 0) {
          return { ok: false, reason: "server_unavailable", profile: null };
        }

        return Promise.race([
          Promise.resolve(promise).catch((error) => ({
            ok: false,
            reason: "server_unavailable",
            profile: null,
            error
          })),
          wait(remaining).then(() => ({
            ok: false,
            reason: "server_unavailable",
            profile: null
          }))
        ]);
      }

      async function retryAuthUntilDeadline(initialResult) {
        let result = initialResult;

        while (result?.reason === "server_unavailable" && loadingTimeRemaining() > 0) {
          const pause = Math.min(700, loadingTimeRemaining());
          if (pause > 0) await wait(pause);
          if (loadingTimeRemaining() <= 0) break;

          result = await waitForAuthResult(
            window.SonaraAuth.verify({
              mode: "optional",
              redirectOnFailure: false
            })
          );
        }

        return result;
      }

      function clearSession() {
        window.SonaraAuth?.clear?.();
      }

      function goToInscription() {
        window.location.replace("/app/pages/auth/inscription.html");
      }

      function redirectByRole(profile) {
        const role = String(profile?.role || "").toLowerCase();
        const status = String(profile?.status || "").toLowerCase();

        if (["artist", "both"].includes(role)) {
          window.location.replace(
            status === "pending"
              ? "/app/pages/auth/pending.html"
              : "/app/pages/creator/dashboard.html"
          );
          return;
        }

        if (role === "user") {
          window.location.replace("/home.html");
          return;
        }

        clearSession();
        goToInscription();
      }

      function loadAuthGuard() {
        return new Promise((resolve, reject) => {
          if (window.SonaraAuth?.ready) {
            resolve();
            return;
          }

          const existing = document.querySelector('script[data-sonara-auth="entry"]');
          if (existing) {
            existing.addEventListener("load", resolve, { once: true });
            existing.addEventListener("error", reject, { once: true });
            return;
          }

          const script = document.createElement("script");
          script.src = "/app/js/core/auth-guard.js?v=pre-v1-entry-timeout-15s-v1";
          script.dataset.sonaraAuth = "entry";
          script.onload = resolve;
          script.onerror = () => reject(new Error("Auth Guard indisponible."));
          document.body.appendChild(script);
        });
      }

      async function showServerError() {
        loader?.classList.add("has-error");
        setProgress(Math.max(currentProgress, 12), "Serveur indisponible");
        await writeStatus("Connexion au serveur impossible.", true);
        if (retryButton) retryButton.hidden = false;
        // Aucun autre minuteur : l'utilisateur peut laisser cet écran ouvert
        // aussi longtemps qu'il le souhaite, puis choisir lui-même « Réessayer ».
      }

      async function startSonara() {
        loadingStartedAt = performance.now();
        loader?.classList.remove("has-error");
        if (retryButton) retryButton.hidden = true;

        try {
          await waitForTranslations();
          await showStep("Recherche du serveur Sonara Pack…", 12, "Serveur · 1/4");
          await checkServerUntilReady();

          await Promise.all([
            loadAuthGuard(),
            showStep("Serveur trouvé. Chargement des données…", 42, "Données · 2/4")
          ]);

          const [, firstAuthResult] = await Promise.all([
            showStep("Recherche de l’ID du compte connecté…", 68, "Compte · 3/4"),
            waitForAuthResult(window.SonaraAuth.ready)
          ]);

          const authResult = await retryAuthUntilDeadline(firstAuthResult);

          if (!authResult?.ok) {
            if (authResult?.reason === "server_unavailable") {
              await showServerError();
              return;
            }

            if ([
              "missing_profile",
              "profile_not_found",
              "invalid_profile",
              "blocked",
              "permanently_deleted"
            ].includes(authResult?.reason)) {
              const message = authResult.reason === "missing_profile"
                ? "Aucun ID connecté. Ouverture de l’inscription…"
                : "ID introuvable. Retour à l’inscription…";

              await showStep(message, 92, "Inscription · 4/4", 520);
              await waitForMinimumLoadingDuration();
              setProgress(100, "Inscription");
              await wait(180);
              goToInscription();
              return;
            }

            await showServerError();
            return;
          }

          await showStep("ID retrouvé. Préparation de votre dashboard…", 88, "Accès · 4/4", 460);
          await waitForMinimumLoadingDuration();
          await showStep("Entrée dans Sonara Pack…", 100, "Sonara Pack", 420);
          redirectByRole(authResult.profile);
        } catch (error) {
          console.error("Chargement Sonara impossible :", error);
          await showServerError();
        }
      }

      retryButton?.addEventListener("click", () => window.location.reload());
      window.addEventListener("sonara:languagechange", () => {
        writeStatus(currentStatusSource, true);
        setProgress(currentProgress, currentStepSource);
      });

      async function ensureLanguageChoice() {
        try {
          await window.SonaraI18n?.ready;
        } catch (error) {
          console.warn("Initialisation de la langue indisponible :", error);
        }

        if (window.SonaraI18n?.hasChosenLanguage?.()) {
          document.documentElement.dataset.sonaraLanguageChosen = "true";
          languageChoice?.setAttribute("aria-hidden", "true");
          return;
        }

        document.documentElement.dataset.sonaraLanguageChosen = "false";
        languageChoice?.removeAttribute("aria-hidden");

        await new Promise((resolve) => {
          let choosing = false;

          languageChoiceButtons.forEach((button) => {
            button.addEventListener("click", async () => {
              if (choosing) return;
              choosing = true;
              languageChoiceButtons.forEach((item) => { item.disabled = true; });
              button.classList.add("is-selecting");

              try {
                await window.SonaraI18n?.setLanguage?.(button.dataset.language);
                document.documentElement.dataset.sonaraLanguageChosen = "true";
                languageChoice?.classList.add("is-leaving");
                await wait(420);
                languageChoice?.setAttribute("aria-hidden", "true");
                resolve();
              } catch (error) {
                console.error("Choix de langue impossible :", error);
                choosing = false;
                button.classList.remove("is-selecting");
                languageChoiceButtons.forEach((item) => { item.disabled = false; });
              }
            });
          });
        });
      }

      function sanitizeReplayReturnTarget(rawTarget) {
        if (!rawTarget || !rawTarget.startsWith("/") || rawTarget.startsWith("//")) return "";

        try {
          const targetUrl = new URL(rawTarget, window.location.origin);
          if (targetUrl.origin !== window.location.origin) return "";
          if (/\/index\.html$/i.test(targetUrl.pathname)) return "";
          return `${targetUrl.pathname}${targetUrl.search}${targetUrl.hash}`;
        } catch {
          return "";
        }
      }

      function getCinematicReplayRequest() {
        const params = new URLSearchParams(window.location.search);
        const queryReplay = params.get("cinematic") === "replay";
        let sessionReplay = null;

        try {
          sessionReplay = JSON.parse(
            sessionStorage.getItem("sonara:cinematicReplayRequest") || "null"
          );
        } catch {
          sessionReplay = null;
        }

        const recentSessionReplay = Boolean(
          sessionReplay &&
          Number.isFinite(Number(sessionReplay.requestedAt)) &&
          Date.now() - Number(sessionReplay.requestedAt) < 5 * 60 * 1000
        );

        const isReplay = queryReplay || recentSessionReplay;
        if (!isReplay) return { isReplay: false, returnTo: "" };

        return {
          isReplay: true,
          returnTo: sanitizeReplayReturnTarget(
            params.get("returnTo") || sessionReplay?.returnTo || "/home.html"
          ) || "/home.html"
        };
      }

      function clearCinematicReplayRequest() {
        try {
          sessionStorage.removeItem("sonara:cinematicReplayRequest");
        } catch {
          // Aucun stockage de session disponible : la query-string suffit.
        }
      }

      async function startEntryFlow() {
        const replayRequest = getCinematicReplayRequest();
        let cinematicResult = null;

        await ensureLanguageChoice();

        try {
          cinematicResult = await window.SonaraPreV1Cinematic?.start?.({
            forceReplay: replayRequest.isReplay
          });
        } catch (error) {
          console.warn("Cinématique Pre-V1 indisponible :", error);
          window.SonaraPreV1Cinematic?.skip?.();
        }

        loader?.classList.remove("is-cinematic-waiting", "is-cinematic-arriving");
        loader?.removeAttribute("aria-hidden");

        if (replayRequest.isReplay) {
          // Le retour n’arrive qu’APRÈS la résolution de la lecture complète.
          // Un replay volontaire ne passe jamais par le chargement/auth normal.
          if (cinematicResult?.played !== true) {
            console.warn("Replay demandé mais cinématique non jouée :", cinematicResult);
          }

          clearCinematicReplayRequest();
          await wait(220);
          window.location.replace(replayRequest.returnTo);
          return;
        }

        await startSonara();
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", startEntryFlow, { once: true });
      } else {
        startEntryFlow();
      }
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr" translate="yes">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sonara - Artist Dashboard</title>

  <link rel="icon" href="/assets/image/logo-sonara-pack.PNG" type="image/png">
  <link rel="shortcut icon" href="/assets/image/logo-sonara-pack.PNG" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/app/css/components/header/header.css?v=artist-dashboard-shell-v1">
  <link rel="stylesheet" href="/app/css/core/catalog-shell.css?v=5.3.8.67">
  <link rel="stylesheet" href="/app/css/creator/dashboard/creator.css?v=artist-shop-catalogue-v3">
  <link rel="stylesheet" href="/app/css/core/i18n.css?v=5.3.8.76-header-language">
  <link rel="stylesheet" href="/app/css/home/pre-v1-notice.css?v=pre-v1-announcement-1">
</head>

<body class="creator-dashboard-body sonara-shell-page">
  <div class="finger"></div>

  <div class="desktop-shell">
    <aside class="desktop-side-panel" aria-label="Navigation principale">
      <div class="desktop-side-brand">
        <span class="desktop-brand-logo">
          <img src="/assets/image/logo-sonara-pack.PNG" alt="">
        </span>

        <span class="desktop-brand-copy">
          <strong>Sonara Pack</strong>
          <small class="desktop-brand-version">Version</small>
        </span>
      </div>

      <nav class="desktop-side-nav">
        <button class="desktop-nav-btn" type="button" data-creator-nav="home">
          <i data-lucide="home"></i>
          <span>
            <strong>Accueil</strong>
            <small>Explorer les packs</small>
          </span>
        </button>

        <button class="desktop-nav-btn desktop-nav-create active" type="button" data-creator-nav="create">
          <i data-lucide="plus-circle"></i>
          <span>
            <strong>Créer</strong>
            <small>Espace artiste</small>
          </span>
        </button>

        <button class="desktop-nav-btn" type="button" data-creator-nav="library">
          <i data-lucide="library"></i>
          <span>
            <strong>Bibliothèque</strong>
            <small>Vos téléchargements</small>
          </span>
        </button>

        <button class="desktop-nav-btn" type="button" data-sonara-montage-entry hidden>
          <i data-lucide="clapperboard"></i>
          <span>
            <strong>Sync</strong>
            <small>Synchroniser vos sons</small>
          </span>
        </button>
      </nav>

      <div class="desktop-side-footer">
        <span class="desktop-status-dot" aria-hidden="true"></span>
        <span>
          <strong>Sonara Artist</strong>
          <small>Environnement actif</small>
        </span>
      </div>
    </aside>

    <div class="desktop-workspace">
      <header class="header"></header>

      <main class="app-layout">
        <nav class="mobile-bottom-bar" aria-label="Navigation mobile">
          <button class="nav-mobile-btn nav-mobile-home" type="button" data-creator-nav="home">
            <i data-lucide="home"></i>
            <span>Accueil</span>
          </button>

          <button class="nav-mobile-btn nav-mobile-create active" type="button" data-creator-nav="create">
            <i data-lucide="plus-circle"></i>
            <span>Crée</span>
          </button>

          <button class="nav-mobile-btn nav-mobile-library" type="button" data-creator-nav="library">
            <i data-lucide="library"></i>
            <span>Bibliothèque</span>
          </button>

          <button class="nav-mobile-btn nav-mobile-montage" type="button" data-sonara-montage-entry hidden>
            <i data-lucide="clapperboard"></i>
            <span>Sync</span>
          </button>
        </nav>

        <section class="main-content">
          <section class="scroll-zone">
            <section class="creator-page shell-content"></section>
          </section>
        </section>
      </main>
    </div>
  </div>

  <script src="/app/js/core/config.js?v=pre-v1-01-version"></script>
  <script src="/app/js/core/auth-guard.js?v=pre-v1-language-first-entry-v2" data-sonara-auth="required"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="/app/js/components/header/header.js?v=artist-dashboard-shell-v1"></script>
  <script src="/app/js/components/navigation/montage-access.js?v=montage-v1"></script>
  <script src="/app/js/home/pre-v1-notice.js?v=pre-v1-announcement-1"></script>
  <script src="/app/js/catalog/distribution.js?v=artist-shop-distribution-v1"></script>
  <script src="/app/js/creator/dashboard/creator.js?v=local-create-pack-access-v1"></script>
  <script src="/app/js/core/i18n.js?v=artist-shop-owned-preview-v1" defer></script>
</body>
</html>

<body class="home sonara-shell-page">

  <div class="desktop-shell">
    <aside
      class="desktop-side-panel"
      aria-label="Navigation principale"
    >
      <div class="desktop-side-brand">
        <span class="desktop-brand-logo">
          <img
            src="/assets/image/logo-sonara-pack.PNG"
            alt=""
          >
        </span>

        <span class="desktop-brand-copy">
          <strong>Sonara Pack</strong>
          <small class="desktop-brand-version">
            Version V5.3.8.56
          </small>
        </span>
      </div>

      <nav class="desktop-side-nav">
        <button
          class="desktop-nav-btn active"
          type="button"
          data-home-nav="home"
        >
          <i data-lucide="home"></i>

          <span>
            <strong>Accueil</strong>
            <small>Explorer les packs</small>
          </span>
        </button>

        <button
          class="desktop-nav-btn desktop-nav-create"
          type="button"
          data-home-nav="create"
        >
          <i data-lucide="plus-circle"></i>

          <span>
            <strong>Créer</strong>
            <small>Espace artiste</small>
          </span>
        </button>

        <button
          class="desktop-nav-btn"
          type="button"
          data-home-nav="library"
        >
          <i data-lucide="library"></i>

          <span>
            <strong>Bibliothèque</strong>
            <small>Vos téléchargements</small>
          </span>
        </button>
      </nav>

      <div class="desktop-side-footer">
        <span class="desktop-status-dot" aria-hidden="true"></span>

        <span>
          <strong>Sonara catalogue</strong>
          <small>Environnement actif</small>
        </span>
      </div>
    </aside>

    <div class="desktop-workspace">
      <header class="header"></header>

      <main class="app-layout">
        <nav class="mobile-bottom-bar">

          <button
            class="nav-mobile-btn nav-mobile-home active"
            type="button"
            data-home-nav="home"
          >
            <i data-lucide="home"></i>
            <span>Accueil</span>
          </button>

          <button
            class="nav-mobile-btn nav-mobile-create"
            type="button"
            data-home-nav="create"
          >
            <i data-lucide="plus-circle"></i>
            <span>Crée</span>
          </button>

          <button
            class="nav-mobile-btn nav-mobile-library"
            type="button"
            data-home-nav="library"
          >
            <i data-lucide="library"></i>
            <span>Bibliothèque</span>
          </button>

        </nav>

        <section class="main-content">
          <section class="scroll-zone">

            <!-- TOUT LE CONTENU JS SERA INJECTÉ ICI -->
            <section class="home-content shell-content"></section>

          </section>
        </section>
      </main>
    </div>

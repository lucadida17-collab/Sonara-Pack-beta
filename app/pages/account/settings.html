<!DOCTYPE html>
<html lang="fr" translate="yes">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <link rel="icon" href="/assets/image/logo-sonara-pack.PNG" type="image/png">
 <link rel="shortcut icon" href="/assets/image/logo-sonara-pack.PNG" type="image/png">
 <link rel="shortcut icon" href="/app/css/account/settings.css" type="image/png">
  <title>Sonara Paramétre</title>
  <link rel="stylesheet" href="/app/css/account/settings.css">
  <link rel="stylesheet" href="/app/css/core/i18n.css">
</head>


<body class="settings">

  <main class="app-layout">

    <section class="settings-page">

      <header class="settings-header">

        <button
          type="button"
          class="settings-back-button"
          aria-label="Retour"
        >
          <i data-lucide="arrow-left"></i>
        </button>

        <h1 class="settings-title">
          Paramètres
        </h1>

        <div class="settings-header-space"></div>

      </header>

      <div class="settings-content">

        <div class="settings-group">

          <button
            type="button"
            class="settings-row"
            data-path="./settings/language.html"
          >
            <span class="settings-row-left">
              <i data-lucide="languages"></i>
              <span>Langue</span>
            </span>

            <i
              data-lucide="chevron-right"
              class="settings-chevron"
            ></i>
          </button>

          <button
            type="button"
            class="settings-row"
            data-path="./settings/reglement.html"
          >
            <span class="settings-row-left">
              <i data-lucide="shield-check"></i>
              <span>Règlement</span>
            </span>

            <i
              data-lucide="chevron-right"
              class="settings-chevron"
            ></i>
          </button>

          <button
            type="button"
            class="settings-row"
            data-path="./settings/legal.html"
          >
            <span class="settings-row-left">
              <i data-lucide="scale"></i>
              <span>Pages légales</span>
            </span>

            <i
              data-lucide="chevron-right"
              class="settings-chevron"
            ></i>
          </button>

          <button
            type="button"
            class="settings-row"
            data-path="./settings/account.html"
          >
            <span class="settings-row-left">
              <i data-lucide="circle-user-round"></i>
              <span>Mon compte</span>
            </span>

            <i
              data-lucide="chevron-right"
              class="settings-chevron"
            ></i>
          </button>

        </div>

        <div class="settings-group">

          <button
            type="button"
            class="settings-row"
            data-path="./settings/support.html"
          >
            <span class="settings-row-left">
              <i data-lucide="circle-help"></i>
              <span>Support</span>
            </span>

            <i
              data-lucide="chevron-right"
              class="settings-chevron"
            ></i>
          </button>

          <button
            type="button"
            class="settings-row"
            data-path="./settings/feedback.html"
          >
            <span class="settings-row-left">
              <i data-lucide="message-square"></i>
              <span>Commentaires</span>
            </span>

            <i
              data-lucide="chevron-right"
              class="settings-chevron"
            ></i>
          </button>

        </div>

      </div>

    </section>

  </main>

  <script src="/app/js/core/config.js"></script>
<script src="/app/js/core/auth-guard.js?v=main-strict-account-id-v1" data-sonara-auth="required"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="/app/js/account/settings.js"></script>

  <script src="/app/js/core/i18n.js?v=pre-v1-language-global-v5" defer></script>
</body>
</html>

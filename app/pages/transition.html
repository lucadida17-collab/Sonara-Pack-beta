<!DOCTYPE html>
<html lang="fr" translate="yes">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Sonara Pack — Ouverture du Dashboard Artistique</title>

  <link
    rel="icon"
    href="../../assets/image/logo-sonara-pack.PNG"
    type="image/png"
  >

  <link
    rel="shortcut icon"
    href="../../assets/image/logo-sonara-pack.PNG"
    type="image/png"
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  >

  <!--
    Réutilisation exacte des classes 3D du chargeur Mes packs.
  -->
  <link
    rel="stylesheet"
    href="../css/pack.css?v=5.3.8.44-home-creator-loader"
  >

  <link
    rel="stylesheet"
    href="../css/transition.css?v=5.3.8.44-home-creator-loader"
  >
</head>

<body class="sonara-home-creator-loading">
  <main>
    <section
      class="my-pack-page-loader"
      role="progressbar"
      aria-label="Ouverture du Dashboard Artistique"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="5"
    >
      <div class="my-pack-loader-scene" aria-hidden="true">
        <span
          class="my-pack-loader-orbit my-pack-loader-orbit-one"
        ></span>

        <span
          class="my-pack-loader-orbit my-pack-loader-orbit-two"
        ></span>

        <span class="my-pack-loader-core">
          <span></span>
          <span></span>
          <span></span>
        </span>
      </div>

      <p class="my-pack-loader-label">SONARA PACK</p>

      <h1>Ouverture du Dashboard Artistique</h1>

      <p class="my-pack-loader-message">
        Préparation de votre espace Creator…
      </p>

      <div class="my-pack-loader-progress" aria-hidden="true">
        <span class="my-pack-loader-progress-fill"></span>
      </div>
    </section>
  </main>

  <script src="../../config.js?v=5.3.8.44-home-creator-loader"></script>

  <script
    src="../js/transition.js?v=5.3.8.44-home-creator-loader"
  ></script>
</body>

</html>

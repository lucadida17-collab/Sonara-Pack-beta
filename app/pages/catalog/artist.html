<!DOCTYPE html>
<html lang="fr" translate="yes">
<head>
  <meta charset="UTF-8">
    <meta name="robots" content="index, follow">
  <meta name="description" content="Découvrez ce profil artiste et ses packs publics sur Sonara Pack.">
  <script src="/app/js/core/seo-environment.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artiste | Sonara Pack</title>

  <link rel="stylesheet" href="/app/css/catalog/artist.css?v=pre-v1-artist-public-v1.1-responsive">
  <link rel="stylesheet" href="/app/css/components/header/header.css?v=cinematic-replay-component-v3">
  <link rel="stylesheet" href="/app/css/core/catalog-shell.css?v=5.3.8.67">
  <link rel="stylesheet" href="/app/css/core/i18n.css">
  <link rel="stylesheet" href="/app/css/system/loading-experience.css?v=loading-advice-mobile-compact-v1">

  <link rel="icon" href="/assets/image/logo-sonara-pack.PNG" type="image/png">
  <link rel="shortcut icon" href="/assets/image/logo-sonara-pack.PNG" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>

<body class="artist-public-page sonara-shell-page">
  <div class="desktop-shell">
    <aside class="desktop-side-panel" aria-label="Navigation principale">
      <div class="desktop-side-brand">
        <span class="desktop-brand-logo">
          <img src="/assets/image/logo-sonara-pack.PNG" alt="">
        </span>

        <span class="desktop-brand-copy">
          <strong>Sonara Pack</strong>
          <small class="desktop-brand-version">Version</small>
        </span>
      </div>

      <nav class="desktop-side-nav">
        <button class="desktop-nav-btn active" type="button" data-artist-nav="home">
          <i data-lucide="home"></i>
          <span>
            <strong>Accueil</strong>
            <small>Explorer les packs</small>
          </span>
        </button>

        <button class="desktop-nav-btn desktop-nav-create" type="button" data-artist-nav="create">
          <i data-lucide="plus-circle"></i>
          <span>
            <strong>Créer</strong>
            <small>Espace artiste</small>
          </span>
        </button>

        <button class="desktop-nav-btn" type="button" data-artist-nav="library">
          <i data-lucide="library"></i>
          <span>
            <strong>Bibliothèque</strong>
            <small>Vos téléchargements</small>
          </span>
        </button>

        <button class="desktop-nav-btn" type="button" data-sonara-montage-entry hidden>
          <i data-lucide="clapperboard"></i>
          <span>
            <strong>Sync</strong>
            <small>Synchroniser vos sons</small>
          </span>
        </button>
      </nav>

      <div class="desktop-side-footer">
        <span class="desktop-status-dot" aria-hidden="true"></span>
        <span>
          <strong>Sonara catalogue</strong>
          <small>Environnement actif</small>
        </span>
      </div>
    </aside>

    <div class="desktop-workspace">
      <header class="header"></header>

      <main class="app-layout">
        <nav class="mobile-bottom-bar">
          <button class="nav-mobile-btn nav-mobile-home active" type="button" data-artist-nav="home">
            <i data-lucide="home"></i>
            <span>Accueil</span>
          </button>

          <button class="nav-mobile-btn nav-mobile-create" type="button" data-artist-nav="create">
            <i data-lucide="plus-circle"></i>
            <span>Crée</span>
          </button>

          <button class="nav-mobile-btn nav-mobile-library" type="button" data-artist-nav="library">
            <i data-lucide="library"></i>
            <span>Bibliothèque</span>
          </button>

          <button class="nav-mobile-btn nav-mobile-montage" type="button" data-sonara-montage-entry hidden>
            <i data-lucide="clapperboard"></i>
            <span>Sync</span>
          </button>
        </nav>

        <section class="main-content">
          <section class="scroll-zone">
            <section class="artist-public-content shell-content" aria-live="polite">
              <section class="artist-public-loading sonara-loading-surface" data-sonara-loading-audience="user" role="status">
                <p>Chargement du profil artiste…</p>
              </section>
            </section>
          </section>
        </section>
      </main>
    </div>
  </div>

  <script src="/app/js/core/config.js?v=pre-v1-commercial-1"></script>
  <script src="/app/js/core/auth-guard.js?v=main-strict-account-id-v1" data-sonara-auth="required"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="/app/js/components/header/header.js?v=cinematic-replay-component-v3"></script>
  <script src="/app/js/components/navigation/montage-access.js?v=sync-no-library-v1"></script>
  <script src="/app/js/catalog/distribution.js?v=visibility-v2"></script>
  <script src="/app/js/system/loading-experience.js?v=loading-tip-controls-v1"></script>
  <script src="/app/js/catalog/artist.js?v=loading-bg-v1"></script>
  <script src="/app/js/core/i18n.js?v=loader-language-v1" defer></script>
</body>
</html>

<head>
  <link rel="icon" href="/assets/image/logo-sonara-pack.PNG" type="image/png">
  <link rel="shortcut icon" href="/assets/image/logo-sonara-pack.PNG" type="image/png">

<meta name="viewport" content="width=device-width, Initial-scale=1.0">
 <title>Sonara Pack</title>
</head>


<header class="dynamic-header">
  <button
    class="dynamic-header-profile"
    id="dynamicHeaderProfile"
    type="button"
    aria-label="Ouvrir le profil"
  >
    <div class="dynamic-header-avatar">
      <img
        class="dynamic-header-image"
        id="dynamicHeaderImage"
        src=""
        alt="Photo de profil"
      >

      <i
        class="dynamic-header-icon"
        id="dynamicHeaderIcon"
        data-lucide="user"
        aria-hidden="true"
      ></i>
    </div>

    <span
      class="dynamic-header-title"
      id="dynamicHeaderTitle"
    >
      Accueil
    </span>
  </button>

  <div class="dynamic-header-actions">
    <button
      class="dynamic-header-share"
      id="dynamicHeaderShare"
      type="button"
      aria-label="Partager"
      title="Partager"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3v12"></path>
        <path d="m8 7 4-4 4 4"></path>
        <path d="M5 10v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-9"></path>
      </svg>
    </button>

    <button
      class="dynamic-header-cinematic"
      id="dynamicHeaderCinematic"
      type="button"
      aria-label="Revoir la cinématique"
      title="Revoir la cinématique"
    >
      <i data-lucide="clapperboard" aria-hidden="true"></i>
    </button>
  </div>
</header>

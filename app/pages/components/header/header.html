<head>
<meta name="viewport" content="width=device-width, Initial-scale=1.0">
 <title>Sonara Pack</title>
</head>


<header class="dynamic-header">
  <button
    class="dynamic-header-profile"
    id="dynamicHeaderProfile"
    type="button"
    aria-label="Ouvrir le profil"
  >
    <div class="dynamic-header-avatar">
      <img
        class="dynamic-header-image"
        id="dynamicHeaderImage"
        src=""
        alt="Photo de profil"
      >

      <i
        class="dynamic-header-icon"
        id="dynamicHeaderIcon"
        data-lucide="user"
        aria-hidden="true"
      ></i>
    </div>

    <span
      class="dynamic-header-title"
      id="dynamicHeaderTitle"
    >
      Accueil
    </span>
  </button>

  <div class="dynamic-header-actions">
    <div
      class="dynamic-header-language-slot"
      data-sonara-language-slot
      aria-label="Traduction"
    ></div>
  </div>
</header>

<!DOCTYPE html>
<html lang="fr" translate="yes">
<head>
  <link rel="icon" href="/assets/image/logo-sonara-pack.PNG" type="image/png">
  <link rel="shortcut icon" href="/assets/image/logo-sonara-pack.PNG" type="image/png">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050914">
  <title>Sonara Pack — Redirection sécurisée</title>
  <link rel="stylesheet" href="/app/css/system/loading-experience.css?v=loading-advice-mobile-compact-v1">
  <link rel="stylesheet" href="/app/css/system/stripe-loading.css?v=stripe-loading-responsive-v3">
  <link rel="stylesheet" href="/app/css/core/i18n.css">
</head>
<body>
  <main class="stripe-loading-page sonara-loading-surface" data-sonara-loading-audience="user" data-sonara-loading-tip-host=".stripe-loading-card" aria-live="polite">
    <picture class="stripe-loading-visual" aria-hidden="true">
      <source media="(min-width: 2000px)" srcset="/assets/image/loading/sonara-loading-wide.jpeg">
      <source media="(min-width: 1600px)" srcset="/assets/image/loading/sonara-loading-wide.jpeg">
      <source media="(min-width: 1200px)" srcset="/assets/image/loading/sonara-loading-desktop.jpeg">
      <source media="(min-width: 900px)" srcset="/assets/image/loading/sonara-loading-compact-screen.jpeg">
      <source media="(min-width: 600px)" srcset="/assets/image/loading/sonara-loading-tablet-portrait.jpeg">
      <img src="/assets/image/loading/sonara-loading-mobile-portrait.jpeg" alt="">
    </picture>
    <div class="stripe-loading-shade" aria-hidden="true"></div>
    <section class="stripe-loading-card">
      <p class="stripe-loading-kicker">SONARA PACK · PAIEMENT SÉCURISÉ</p>

      <h1>Chargement de la redirection</h1>
      <p class="stripe-loading-status" id="stripeLoadingStatus">Préparation de votre achat…</p>

      <div class="stripe-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="stripe-progress-bar" id="stripeProgressBar"></div>
      </div>
      <div class="stripe-progress-meta">
        <span id="stripeProgressStep">Initialisation</span>
        <strong id="stripeProgressValue">0 %</strong>
      </div>

      <div class="stripe-loading-error" id="stripeLoadingError" hidden>
        <p id="stripeLoadingErrorMessage"></p>
        <div class="stripe-loading-actions">
          <button type="button" id="stripeRetryButton">Réessayer</button>
          <button type="button" id="stripeReturnButton" class="secondary">Retour au pack</button>
        </div>
      </div>
    </section>
  </main>

  <script src="/app/js/core/config.js?v=pre-v1-commercial-1"></script>
<script src="/app/js/core/auth-guard.js?v=pre-v1-language-first-entry-v2" data-sonara-auth="required"></script>
  <script src="/app/js/system/loading-experience.js?v=stripe-loading-responsive-v3" defer></script>
  <script src="/app/js/system/stripe-loading.js?v=stripe-loading-responsive-v3" defer></script>
  <script src="/app/js/core/i18n.js?v=loader-language-v1" defer></script>
</body>
</html>

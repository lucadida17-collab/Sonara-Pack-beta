<!DOCTYPE html>
<html lang="fr" translate="yes">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050914">
  <title>Sonara Pack — Redirection sécurisée</title>
  <link rel="stylesheet" href="/app/css/system/stripe-loading.css">
  <link rel="stylesheet" href="/app/css/core/i18n.css">
</head>
<body>
  <main class="stripe-loading-page" aria-live="polite">
    <section class="stripe-loading-card">
      <p class="stripe-loading-kicker">SONARA PACK · PAIEMENT SÉCURISÉ</p>

      <div class="stripe-loader-scene" aria-hidden="true">
        <div class="stripe-loader-ring stripe-loader-ring-a"></div>
        <div class="stripe-loader-ring stripe-loader-ring-b"></div>
        <div class="stripe-loader-core">S</div>
      </div>

      <h1>Chargement de la redirection</h1>
      <p class="stripe-loading-status" id="stripeLoadingStatus">Préparation de votre achat…</p>

      <div class="stripe-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="stripe-progress-bar" id="stripeProgressBar"></div>
      </div>
      <div class="stripe-progress-meta">
        <span id="stripeProgressStep">Initialisation</span>
        <strong id="stripeProgressValue">0 %</strong>
      </div>

      <div class="stripe-loading-error" id="stripeLoadingError" hidden>
        <p id="stripeLoadingErrorMessage"></p>
        <div class="stripe-loading-actions">
          <button type="button" id="stripeRetryButton">Réessayer</button>
          <button type="button" id="stripeReturnButton" class="secondary">Retour au pack</button>
        </div>
      </div>
    </section>
  </main>

  <script src="/app/js/core/config.js?v=pre-v1-commercial-1"></script>
<script src="/app/js/core/auth-guard.js?v=pre-v1-language-first-entry-v1" data-sonara-auth="required"></script>
  <script src="/app/js/system/stripe-loading.js?v=pre-v1-commercial-1" defer></script>
  <script src="/app/js/core/i18n.js?v=pre-v1-language-global-v5" defer></script>
</body>
</html>
